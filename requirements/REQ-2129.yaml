id: REQ-2129
source: https://github.com/MessagePack-CSharp/MessagePack-CSharp/issues/2129
title: Allow generation of a formatter for a type in a referenced assembly
intent: >
  A project that references MessagePack can get a source-generated IMessagePackFormatter<T> for a type T that is
  declared in another assembly, where T carries no MessagePack attributes and the assembly cannot reference MessagePack.
  The issue proposes a [GeneratedMessagePackFormatter] attribute on a partial class implementing IMessagePackFormatter<T>.
  The maintainer's reply suggests contractless mode by default (use attributes if present, otherwise contractless),
  asks whether only public members are serialized, and advises avoiding new attribute definitions that are reflected at run time.
functional:
  - id: REQ-2129-F1
    text: A partial class marked [GeneratedMessagePackFormatter] that implements IMessagePackFormatter<T> gets its body generated for a T from a referenced assembly, with the formatter declared in the consuming project.
  - id: REQ-2129-F2
    text: With no MessagePack attributes on T, serialization defaults to contractless behaviour over public members.
  - id: REQ-2129-F3
    text: "Attributes on T are honoured when present (maintainer: 'If there are attributes on it, fine, we''ll use them')."
  - id: REQ-2129-F4
    text: The generated resolver registers the generated formatter so MessagePackSerializer finds it.
non_functional:
  - id: REQ-2129-NF1
    text: Nothing needs to be added to the assembly that declares T, and no new runtime dependency or runtime reflection over user-defined attribute copies is introduced.
  - id: REQ-2129-NF2
    text: Behaviour of existing [MessagePackObject] types and existing formatters is unchanged.
  - id: REQ-2129-NF3
    text: New public API and diagnostics are documented and listed in the analyzer release notes.
security:
  - id: REQ-2129-S1
    text: Only public members of T are serialized, and nothing silently changes what is written to the wire for members the owner did not intend to expose.
