<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts · Earned trust in AI code</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 16'%3E%3Cpath d='M1 1h12v12.5l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z' fill='none' stroke='%230C66E4' stroke-width='1.5'/%3E%3Cpath d='M4 5h6M4 8h4' stroke='%230C66E4' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F7F8F9; --surface:#FFFFFF; --ink:#172B4D; --dim:#44546F; --faint:#626F86; --line:#DCDFE4; --soft:#F1F2F4; --sel:#E9F2FF;

  --e0:#8590A2; --e0t:#44546F; --e0b:#F1F2F4; --ref:#C9372C; --reft:#AE2E24; --refb:#FFECEB;
  --code:#F1F2F4; --diffa:#E3FCEF; --diffat:#14573A; --diffd:#FFEBE6; --diffdt:#8A241B;
  --lane0:#DCE6F5; --lane1:#C4D4EE; --lane2:#9DB6E3; --lane3:#6C93D6;
  --shadow:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31); --shadow2:0 8px 12px rgba(9,30,66,.15),0 0 1px rgba(9,30,66,.31);
  --fs-xs:13px; --fs-md:15px; --fs-lg:17px; --fs-xl:24px; --fs-hero:56px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-md)/22px var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:clip}

#bg{display:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* top bar */
header.top{position:sticky;top:0;z-index:40;height:48px;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}

.tabs{display:flex;gap:4px;align-self:stretch}

.tab:hover{color:var(--ink)} .tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.sp{flex:1}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 8px;color:var(--ink);max-width:100%}
.ghost,.solid,.opt{border-radius:3px;border:0;cursor:pointer;padding:6px 12px;font-weight:500;transition:background .15s,transform .1s}
.ghost{background:var(--soft);color:var(--ink)} .ghost:hover{background:var(--line)}
.solid{background:var(--brand);color:var(--onbrand)} .solid:hover{background:var(--brandh)} .solid:active{background:var(--brandp)} .solid:disabled{opacity:.4;cursor:not-allowed}
.ghost:active,.solid:active,.opt:active{transform:translateY(1px)}
kbd{font:600 13px/20px var(--mono);background:var(--soft);color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 4px}
/* page */
main.page{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:24px 24px 48px}
h1{font-size:var(--fs-xl);line-height:28px;font-weight:600;margin:0}
h2{font-size:var(--fs-lg);line-height:24px;font-weight:600;margin:0 0 8px}
.meta{color:var(--faint);font-size:var(--fs-xs);margin-top:4px}
.muted{color:var(--dim)} .faint{color:var(--faint)} .hint{font:var(--fs-xs) var(--mono);color:var(--faint)}
section.scene{margin:32px 0 0} section.scene:first-of-type{margin-top:24px}
/* evidence */
.lv-E3{--c:var(--e3);--ct:var(--e3t);--cb:var(--e3b)} .lv-E2{--c:var(--e2);--ct:var(--e2t);--cb:var(--e2b)} .lv-E1{--c:var(--e1);--ct:var(--e1t);--cb:var(--e1b)}
.lv-E0{--c:var(--e0);--ct:var(--e0t);--cb:var(--e0b)} .lv-REF{--c:var(--ref);--ct:var(--reft);--cb:var(--refb)}
.loz{display:inline-block;font:700 13px/20px var(--sans);letter-spacing:0;text-transform:none;color:var(--ct);background:var(--cb);padding:0 6px;border-radius:3px;white-space:nowrap}
.key{font:500 var(--fs-xs) var(--mono);color:var(--brand);white-space:nowrap}
.tagsyn{font:700 13px/20px var(--sans);letter-spacing:0;text-transform:none;color:var(--e1t);background:var(--e1b);padding:0 6px;border-radius:3px;margin-left:8px;vertical-align:2px}
/* verdict */
.bignum{all:unset;display:block;cursor:pointer;font:700 var(--fs-hero)/1 var(--sans);letter-spacing:-.03em;color:var(--ink)}
.sentence{margin:8px 0 24px;font-size:var(--fs-lg);color:var(--dim)}
.rows{border-top:1px solid var(--line)}
.chk{border-bottom:1px solid var(--line);margin:0}

.chk>summary::-webkit-details-marker{display:none}
.chk>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(-45deg);transition:transform .15s;flex:none}
.chk[open]>summary::after{transform:rotate(45deg)}
.chk b{width:120px;font-weight:600;flex:none} .chk .chs{flex:1;color:var(--dim)}
.chk>div{padding:0 0 12px 136px;color:var(--dim)} .chk>div p{margin:0 0 8px;max-width:64ch}
/* tables */
.tbl{margin-top:8px;overflow-x:auto}
.dense{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
.dense th{text-align:left;color:var(--faint);font-size:var(--fs-xs);font-weight:600;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}

.dense td.k{white-space:nowrap} .num{text-align:right;font-family:var(--mono)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:hidden}
.lt,.arena{width:100%;display:block;height:260px}
.lt-bar{display:flex;gap:12px;align-items:center;margin:12px 0}
.ltcount{font:700 var(--fs-xs) var(--mono);color:var(--dim)} .ltcount.bad{color:var(--reft)}
.lt-foot{display:grid;grid-template-columns:1fr minmax(220px,36%);gap:16px;margin-top:8px;align-items:start;color:var(--dim)}
.shelf{border:1px dashed var(--faint);border-radius:8px;padding:8px 12px;min-height:48px}
.shelf-t{font:700 13px/20px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.shelfrow{padding:4px 0;color:var(--ink);font-size:var(--fs-xs)}
details{margin-top:12px;color:var(--dim)} summary{cursor:pointer;color:var(--dim)}

.xb{all:unset;display:grid;grid-template-columns:1fr auto;gap:16px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;box-sizing:border-box;font-size:var(--fs-xs)}
.xb .tr{display:none} .xb .n{font-family:var(--mono);color:var(--dim)}

.opts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.opt{background:var(--surface);border:1px solid var(--line);color:var(--ink)} .opt:hover{border-color:var(--brand);color:var(--brand)}
.opt[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}

.guard{font:var(--fs-xs) var(--mono);color:var(--faint);margin:4px 0 12px;min-height:16px} .guard .ok{color:var(--e3t);font-weight:700}

.signed .hash{font:700 var(--fs-xs) var(--mono);color:var(--e3t);word-break:break-all}
.bigstamp{position:absolute;right:16px;top:-12px;font:900 var(--fs-lg) var(--sans);letter-spacing:.16em;color:var(--stamp);border:4px double var(--stamp);padding:2px 12px;border-radius:8px;transform:rotate(-8deg);background:var(--bg)}
.rehearsal{margin-top:16px;color:var(--dim);font-size:var(--fs-xs)}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);z-index:90;background:var(--surface);border-left:1px solid var(--line);padding:48px 24px 24px;overflow:auto;transform:translateX(104%);transition:transform .3s cubic-bezier(.2,1.1,.3,1)}
#drawer.open{transform:none;box-shadow:var(--shadow2)} #drawer .x{position:absolute;top:12px;right:16px}
#drawer h3{margin:0 0 8px;font-size:var(--fs-lg);line-height:24px} #drawer h4{margin:16px 0 4px;font:700 13px/20px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.quote{background:var(--code);padding:8px 12px;border-radius:3px;font:var(--fs-xs) var(--mono);margin:4px 0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.diff{font:var(--fs-xs)/16px var(--mono);overflow:auto;background:var(--code);border-radius:3px;margin:4px 0}
.diff div{padding:0 12px;white-space:pre;min-width:max-content;color:var(--ink)} .diff .a{background:var(--diffa);color:var(--diffat)} .diff .d{background:var(--diffd);color:var(--diffdt)} .diff .h{color:var(--faint)}
.kpis{display:flex;gap:32px;flex-wrap:wrap;margin:12px 0} .kpi b{display:block;font:700 var(--fs-xl)/1.2 var(--sans)} .kpi span{color:var(--dim);font-size:var(--fs-xs)}
/* board */
.board{display:flex;gap:16px;overflow-x:auto;margin-top:16px;padding-bottom:8px}
.col{flex:1 0 190px;background:var(--soft);border-radius:8px;padding:8px;min-height:160px}
.colh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px;font:700 13px/20px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.kc{background:var(--surface);border-radius:3px;padding:8px 12px;box-shadow:var(--shadow);margin-bottom:8px;transition:transform .15s}
.kc:hover{transform:translateY(-1px)} .kc-t{font:500 var(--fs-xs) var(--mono);overflow-wrap:anywhere}
.kc-m{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs-xs);color:var(--dim)} .kc-m .n{margin-left:auto;font-family:var(--mono)}
.av{width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--dim);border:1px solid var(--line);font:700 9px var(--sans);display:grid;place-items:center;flex:none}
.kc.more{background:none;box-shadow:none;border:1px dashed var(--line);text-align:center;color:var(--faint)}
.stack{background:var(--surface);border-radius:3px;padding:12px;box-shadow:var(--shadow),4px 4px 0 -1px var(--surface),4px 4px 0 0 var(--line);margin:0 4px 12px 0}
.stack .sn{font:700 var(--fs-xl)/1.2 var(--sans)} .stack p{margin:4px 0 8px;color:var(--dim);font-size:var(--fs-xs)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:12px 16px;color:var(--dim);margin-top:12px}
.empty b{color:var(--ink)}
.reco{font-size:var(--fs-lg);line-height:24px;max-width:60ch;margin:0 0 16px}
.pgrid details{border-top:1px solid var(--line);margin:0;padding:8px 0}
.pgrid summary{color:var(--ink);font-weight:500}
.md h1,.md h2,.md h3{margin:16px 0 4px;font-size:var(--fs-lg)} .md p,.md li{max-width:72ch} .md code{background:var(--code);padding:0 4px;border-radius:3px}
.footer{margin-top:48px;color:var(--faint);font-size:var(--fs-xs)}
/* intro + presenter */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#iword{position:absolute;left:0;right:0;top:40%;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:600;font-size:var(--fs-xl);color:var(--ink);opacity:0;transition:opacity .4s}
#iword.on{opacity:1} #itag{position:absolute;left:0;right:0;top:50%;text-align:center;color:var(--dim);opacity:0;transition:opacity .5s} #itag.on{opacity:1}
#iskip{position:absolute;right:24px;bottom:16px;font:var(--fs-xs) var(--mono);color:var(--faint)}
#pbar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#172B4D;color:#fff;padding:12px 24px;display:none;gap:16px;align-items:center}
body.presenting #pbar{display:flex} #pbar .t{font:700 var(--fs-xs) var(--mono);color:#B3C0CE;min-width:80px} #pbar .cap{flex:1;font-size:var(--fs-lg)}
#pbar .ghost{background:transparent;color:#fff;border:1px solid #44546F} .badge-off{font:700 13px/20px var(--sans);letter-spacing:.04em;text-transform:uppercase;border:1px solid #44546F;color:#B3C0CE;border-radius:3px;padding:0 6px}
body.presenting main.page{padding-bottom:120px}
#print{display:none}

.tg-bar{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}
.linkbtn{all:unset;cursor:pointer;color:var(--brand);font-size:var(--fs-md)} .linkbtn:hover{text-decoration:underline}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden} .seg2 button{background:var(--surface);border:0;padding:4px 12px;cursor:pointer;color:var(--dim);font-weight:500} .seg2 button[aria-pressed=true]{background:var(--sel);color:var(--brand)}
.tg{position:relative;overflow-x:auto;padding:8px} .tg svg{display:block;min-width:760px;width:100%;height:auto}
.tgtip{display:none;position:absolute;z-index:5;background:#172B4D;color:#fff;border-radius:3px;padding:4px 8px;font-size:var(--fs-xs);max-width:420px;pointer-events:none;box-shadow:var(--shadow)}
.tgcol{font:600 13px/20px var(--sans);fill:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.tgn{cursor:pointer;outline:none;transition:opacity .2s} .tgn rect{fill:var(--surface);stroke:var(--faint);stroke-width:1}
.tgn text{font:12px var(--sans);fill:var(--ink);pointer-events:none} .k-req text,.k-hunk text{font-family:var(--mono);font-size:11px}
.k-req rect{fill:var(--sel);stroke:var(--brand)} .k-req text{fill:var(--brand)}
.tgn.k-claim rect{fill:var(--cb);stroke:var(--c)} .tgn.k-claim.refused rect{fill:var(--refb);stroke:var(--ref);stroke-dasharray:4 3;stroke-width:1.5}
.tgn.k-hunk.unp rect{stroke-dasharray:4 3;fill:var(--soft)} .tgn.k-group rect,.tgn.k-more rect{fill:var(--soft);stroke:var(--line)} .tgn.k-group text,.tgn.k-more text{fill:var(--dim)}
.tgn.k-test.tmp rect{fill:var(--e3b);stroke:var(--e3)} .tgn.k-test.tmf rect{fill:var(--refb);stroke:var(--ref)} .tgn.k-test.fail rect{fill:var(--refb);stroke:var(--ref);stroke-width:2}
.tgn:focus-visible rect{stroke:var(--brand);stroke-width:2}
.tgn.dim{opacity:.2} .tgn.fade{opacity:.35}
.tgnote{font:11px var(--sans);fill:var(--faint)} .tgfail{font:700 10px var(--sans);fill:var(--reft)}
.tge{fill:none;stroke:var(--faint);stroke-width:1;opacity:.45} .tge.bundle{stroke-dasharray:3 3} .tge.on{opacity:1;stroke:var(--dim);stroke-width:1.5} .tge.dim{opacity:.1}
.tgp{fill:none;stroke:var(--ref);stroke-width:2.5;stroke-linecap:round}

.chk{display:flex;align-items:center;gap:16px;width:100%;padding:12px 0;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.chk:hover{background:var(--soft)} .chk b{width:120px;font-weight:600;flex:none} .chk .chs{flex:1;color:var(--dim)}
.chk::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--faint);border-top:1.5px solid var(--faint);transform:rotate(45deg);flex:none;margin-right:4px}
.sentence{margin:8px 0 16px} .rows{margin-bottom:0}
.tmgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;align-items:start}
.tmp{border-radius:8px;padding:16px;border:1px solid var(--c);background:var(--cb);min-height:112px}
.tmp.red{--c:var(--ref);--cb:var(--refb)} .tmp.green{--c:var(--e3);--cb:var(--e3b)}
.tmp h3{margin:0 0 8px;font-size:var(--fs-lg);color:var(--ct,var(--ink))} .tmp.red h3{color:var(--reft)} .tmp.green h3{color:var(--e3t)}
.tmp .big2{font:600 15px/22px var(--mono);color:var(--ink);word-break:break-word} .tmp ul{margin:8px 0 0;padding-left:20px;font-size:15px} .tmp li{margin:2px 0;font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.tmp .cnt{margin-top:8px;font-weight:600}
.tmcap{margin:12px 0 0;font-size:var(--fs-md);color:var(--dim)} .tmcap.warn{color:var(--e1t);font-weight:600}
.cl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.cl:hover{background:var(--soft)} .cl .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0} .cbar i{display:block;background:var(--c);min-width:4px}
.inp{width:100%;max-width:320px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px 12px;font:inherit;color:var(--ink);margin:4px 0 12px;display:block}
.inp:focus{border-color:var(--brand);outline:none} .lbl{display:block;color:var(--dim);font-size:var(--fs-xs)}
.scalebar{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;margin:12px 0} .scalebar i{display:block;min-width:6px}
.scalelist{list-style:none;margin:0;padding:0} .scalelist li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline} .scalelist b{min-width:64px;font-size:var(--fs-lg)}
.tgn text{font:13px var(--sans)} .k-req text,.k-hunk text{font-family:var(--mono);font-size:13px} .tgcol{font:600 13px var(--sans);fill:var(--faint)} .tgnote{font:13px var(--sans);fill:var(--faint)} .tgfail{font:700 13px var(--sans);fill:var(--reft)}
.ghost.pdf{text-decoration:none;display:inline-block}
@media(max-width:760px){.tmgrid{grid-template-columns:1fr}.chk b{width:96px}.chk{flex-wrap:wrap}.cl{grid-template-columns:1fr auto}.cl .key{grid-column:1/3}.cl .ct{white-space:normal}}

  @page{margin:16mm}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;background:#fff;font:11pt/1.4 var(--sans)}
  #print h1{font-size:18pt;margin:0 0 4pt} #print h2{font-size:11pt;text-transform:uppercase;letter-spacing:.05em;margin:12pt 0 4pt;border-bottom:1px solid #999}

}

  header.top{padding:0 12px;gap:8px;overflow-x:auto} .wordmark span{display:none} main.page{padding:24px 16px 64px}
  .chk>div{padding-left:0} .chk b{width:96px} .lt-foot{grid-template-columns:1fr} .bignum{font-size:48px}

"src/MessagePack.SourceGenerator/CodeAnalysis/TypeCollector.cs","area":"analyzer-core","kind":"src","status":"modified","added":18,"removed":4,"hunks":["h2","h3","h4","h5","h6","h7"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExecutionTests/SuppressedSourceGenerationTests.cs","area":"tests","kind":"test","status":"added","added":37,"removed":0,"hunks":["h8"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.Tests/SuppressSourceGenerationAnalyzerTests.cs","area":"tests","kind":"test","status":"added","added":193,"removed":0,"hunks":["h9"],"binary":false}],"hunks":[{"id":"h1","path":"README.md","kind":"doc","area":"docs","old_start":1617,"old_len":6,"new_start":1617,"new_len":20,"added":14,"removed":0,"text":"@@ -1617,6 +1617,20 @@ This code generation has a minor upfront performance cost.\n > Note: When using Unity, dynamic code generation only works when targeting .NET Framework 4.x + mono runtime.\n For all other Unity targets, AOT is required.\n \n+### Opting out of source generation\n+\n+A `[MessagePackObject]` type can opt out of source generation with `[MessagePackObject(SuppressSourceGeneration = true)]`.\n+No formatter is generated for that type. It is serialized at run time by the dynamic resolvers, which use reflection, so such a type is not AOT-safe.\n+\n+The analyzer still validates these types, because they are serialized at run time and must still have a valid contract:\n+- Members have a `[Key]` or `[IgnoreMember]` attribute ([MsgPack004](doc/analyzers/MsgPack004.md)).\n+- Keys are unique and all of the same kind ([MsgPack005](doc/analyzers/MsgPack005.md)).\n+- Non-public members require `AllowPrivate` ([MsgPack015](doc/analyzers/MsgPack015.md)).\n+- Members have types that are themselves serializable ([MsgPack003](doc/analyzers/MsgPack003.md)).\n+- Types are accessible to the resolver ([MsgPack012](doc/analyzers/MsgPack012.md)).\n+\n+The analyzer does not report the partial-class requirement ([MsgPack011](doc/analyzers/MsgPack // <\/summary>\n+[MessagePackObject(SuppressSourceGeneration = true)]\n+public class SuppressedSourceGenerationType\n+{\n+    [Key(0)]\n+    public int Id { get; set; }\n+\n+    [Key(1)]\n+    public string Name { get; set; } = string.Empty;\n+}\n+\n+public class SuppressedSourceGenerationTests\n+{\n+    [Fact]\n+    public void NoFormatterIsGeneratedForSuppressedType()\n+    {\n+        Assert.Null(GeneratedMessagePackResolver.Instance.GetFormatter<SuppressedSourceGenerationType>());\n+    }\n+\n+    [Fact]\n+    public void SuppressedTypeRoundTripsThroughDynamicResolver()\n+    {\n+        var value = new SuppressedSourceGenerationType { Id = 7, Name = \"seven\" };\n+\n+        byte[] bytes = MessagePackSerializer.Serialize(value, MessagePackSerializerOptions.Standard);\n+        SuppressedSourceGenerationType result = MessagePackSerializer.Deserialize<SuppressedSourceGenerationType>(bytes, MessagePackSerializerOptions.Standard);\n+\n+        Assert.Equal(7, result.Id);\n+        Assert.Equal(\"seven\", result.Name);\n+    }\n+}","group":null},{"id":"h9","path":"tests/MessagePack.SourceGenerator.Tests/SuppressSourceGenerationAnalyzerTests.cs","kind":"test","area":"tests","old_start":0,"old_len":0,"new_start":1,"new_len":193,"added":193,"removed":0,"text":"@@ -0,0 +1,193 @@\n+// Copyright (c) All contributors. All rights reserved.\n+// Licensed under the MIT license. See LICENSE file in the project root for full license information.\n+\n+using MessagePack.Analyzers.CodeFixes;\n+using Microsoft.CodeAnalysis.CSharp;\n+using Microsoft.CodeAnalysis.Testing;\n+using VerifyCS = CSharpCodeFixVerifier<MessagePack.SourceGenerator.Analyzers.MsgPack00xMessagePackAnalyzer, MessagePack.Analyzers.CodeFixes.MessagePackCodeFixProvider>;\n+\n+/// <summary>\n+/// Verifies that the analyzer keeps validating <c>[MessagePackObject(SuppressSourceGeneration = true)]<\/c> types\n+/// (https://github.com/MessagePack-CSharp/MessagePack-CSharp/issues/2234).\n+/// Opting out of source generation only skips generation; the type is still serialized at run time, so its contract must still be checked.\n+/// <\/summary>\n+public class SuppressSourceGenerationAnalyzerTests\n+{\n+    private const string Preamble = @\"\n+using MessagePack;\n+\";\n+\n+    [Fact]\n+    public async Task MemberWithoutKeyIsReported()\n+    {\n+        string input = Preamble + @\"\n+[MessagePackObject(SuppressSourceGeneration = true)]\n+public class Foo\n+{\n+    public string {|MsgPack004:Member|} { get; set; }\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task AllowPrivateRequiredIsReported()\n+    {\n+        string input = Preamble + @\"\n+[{|MsgPack015:MessagePackObject(SuppressSourceGeneration = true)|}]\n+public class Foo\n+{\n+    [Key(0)]\n+    private string member;\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task MemberTypeMustBeMessagePackObjectIsReported()\n+    {\n+        string input = Preamble + @\"\n+public class Other\n+{\n+}\n+\n+[MessagePackObject(SuppressSourceGeneration = true)]\n+public class Foo\n+{\n+    [Key(0)]\n+    public Other {|MsgPack003:Member|} { get; set; }\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task DuplicateIntKeysAreReportedWithoutAnalyzerFailure()\n+    {\n+        string input = Preamble + @\"\n+[MessagePackObject(SuppressSourceGeneration = true)]\n+public class Foo\n+{\n+    [Key(0)]\n+    public string Member1 { get; set; }\n+\n+    {|MsgPack005:[Key(0)]\n+    public string Member2 { get; set; }|}\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task DuplicateStringKeysAreReportedWithoutAnalyzerFailure()\n+    {\n+        string input = Preamble + @\"\n+[MessagePackObject(SuppressSourceGeneration = true)]\n+public class Foo\n+{\n+    [Key(\"\"a\"\")]\n+    public string Member1 { get; set; }\n+\n+    {|MsgPack005:[Key(\"\"a\"\")]\n+    public string Member2 { get; set; }|}\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task MixedKeyKindsAreReportedWithoutAnalyzerFailure()\n+    {\n+        string input = Preamble + @\"\n+[MessagePackObject(SuppressSourceGeneration = true)]\n+public class Foo\n+{\n+    [Key(0)]\n+    public string Member1 { get; set; }\n+\n+    {|MsgPack005:[Key(\"\"Member2\"\")]\n+    public string Member2 { get; set; }|}\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task DuplicateKeysAreReportedWithoutAnalyzerFailureForGeneratedTypes()\n+    {\n+        string input = Preamble + @\"\n+[MessagePackObject]\n+public class Foo\n+{\n+    [Key(0)]\n+    public string Member1 { get; set; }\n+\n+    {|MsgPack005:[Key(0)]\n+    public string Member2 { get; set; }|}\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+            MarkupOptions = MarkupOptions.UseFirstDescriptor,\n+        }.RunAsync();\n+    }\n+\n+    [Fact]\n+    public async Task SourceGenerationOnlyDiagnosticsAreNotReportedWhenSuppressed()\n+    {\n+        // The partial-class requirement (MsgPack011) and the AOT-only checks (MsgPack016, MsgPack017)\n+        // only matter when a formatter is generated, so they are not reported for a suppressed type.\n+        string input = Preamble + @\"\n+[MessagePackObject(AllowPrivate = true, SuppressSourceGeneration = true)]\n+public class Foo\n+{\n+    [Key(0)]\n+    private string member;\n+\n+    [Key(1)]\n+    public string Prop1 { get; init; } = \"\"some default\"\";\n+\n+    [Key(2)]\n+    public string Prop2 { get; set; }\n+}\n+\";\n+\n+        await new VerifyCS.Test\n+        {\n+            TestCode = input,\n+        }.RunAsync();\n+    }\n+}","group":null}]},"route":{"change":"2234","lane":"L2","reasons":[{"rule":"areas","lane":"L2","why":"highest default lane of the touched areas"},{"rule":"LR4","lane":"L2","why":"3 source hunk(s) unprotected by tests"}],"areas":["analyzer-core","docs","tests"],"ceiling_areas":[],"blast_radius":{"threshold":10,"max_references":0,"top_symbol":null,"per_hunk":{"h2":[],"h3":[],"h4":[],"h5":[],"h6":[],"h7":[]}},"flagged_hunks":{"h1":["refusal R-2234-3 (R8-requirement-ambiguity)","refusal R-2234-3 (R8-requirement-ambiguity)","refusal R-2234-4 (R6-doc-overclaim)","claim C7 has only E1 evidence","claim C7 has only E1 evidence","claim C8 has only E1 evidence"],"h2":["refusal R-2234-1 (R3-unverified-root-cause)","refusal R-2234-2 (R2-silent-suppression)","refusal R-2234-2 (R2-silent-suppression)","claim C6 has only E2 evidence","claim C6 has only E2 evidence"],"h3":["claim C3 has only E1 evidence","claim C6 has only E2 evidence"],"h5":["unprotected: reverting this hunk breaks no test","claim C3 has only E1 evidence"],"h6":["unprotected: reverting this hunk breaks no test"],"h7":["unprotected: reverting this hunk breaks no test"],"h8":["claim C5 has only E1 evidence"],"h9":["refusal R-2234-1 (R3-unverified-root-cause)","refusal R-2234-4 (R6-doc-overclaim)","claim C1 has only E1 evidence","claim C1 has only E1 evidence","claim C1 has only E1 evidence","claim C3 has only E1 evidence","claim C4 has only E1 evidence","claim C7 h \n+    private const string Guard = \"#if !NETSTANDARD2_0 && !NETFRAMEWORK\";\n+\n+    private const string TestSource = \"\"\"\n+        using MessagePack;\n+\n+        [MessagePackObject]\n+        public class MyObject\n+        {\n+            [Key(0)]\n+            public int Value { get; set; }\n+        }\n+\n+        [MessagePackObject(keyAsPropertyName: true)]\n+        public class MyStringKeyObject\n+        {\n+            public string Name { get; set; }\n+        }\n+\n+        public enum MyEnum\n+        {\n+            A,\n+            B,\n+        }\n+\n+        [Union(0, typeof(MyUnionMember))]\n+        public interface IMyUnion\n+        {\n+        }\n+\n+        [MessagePackObject]\n+        public class MyUnionMember : IMyUnion\n+        {\n+            [Key(0)]\n+            public int Value { get; set; }\n+        }\n+\n+        namespace MessagePack\n+        {\n+            [GeneratedMessagePackResolver]\n+            partial class GeneratedMessagePackResolver\n+            {\n+            }\n+        }\n+        \"\"\";\n+\n+    [Fact]\n+    public async Task AllGeneratedTypesAreExcludedFromCodeCoverage()\n+    {\n+        IReadOnlyList<(string Path, string Text)> generated = await RunGeneratorAsync(TestSource);\n+\n+        // Formatters for objects (both integer and string keyed), the enum and union, plus the resolver.\n+        string paths = string.Join(Environment.NewLine, generated.Select(g => g.Path));\n+        Assert.True(generated.Count >= 5, $\"Expected generated formatters and resolver, got:{Environment.NewLine}{paths}\");\n+\n+        foreach ((string path, string text) in generated)\n+        {\n+            Assert.True(\n+                text.Contains(ExcludeAttribute),\n+                $\"Generated file '{path}' is missing {ExcludeAttribute}.\");\n+        }\n+    }\n+\n+    [Fact]\n+    public async Task ExcludeAttributeIsGuardedForTargetsWhereItIsUnavailable()\n+    {\n+        IReadOnlyList<(string Path, string Text)> generated = await RunGeneratorAsync(TestSource);\n+\n+        foreach ((string path, string text) in generated)\n+        {\n+            string normalized = text.Replace(\"\\r\\n\", \"\\n\");\n+\n+            // Every occurrence of the attribute must be wrapped by the guard, so netstandard2.0 consumers still compile.\n+            int attributeCount = CountOccurrences(normalized, ExcludeAttribute);\n+            int guardedCount = CountOccurrences(normalized, $\"{Guard}\\n\\t{ExcludeAttribute}\\n#endif\\n\")\n+                + CountOccurrences(normalized, $\"{Guard}\\n{ExcludeAttribute}\\n#endif\\n\");\n+            Assert.True(attributeCount > 0, $\"Generated file '{path}' has no {ExcludeAttribute}.\");\n+            Assert.Equal(attributeCount, guardedCount);\n+        }\n+    }\n+\n+    private static int CountOccurrences(string text, string value)\n+    {\n+        int count = 0;\n+        int index = 0;\n+        while ((index = text.IndexOf(value, index, StringComparison.Ordinal)) >= 0)\n+        {\n+            count++;\n+            index += value.Length;\n+        }\n+\n+        return count;\n+    }\n+\n+    private static async Task<IReadOnlyList<(string Path, string Text)>> RunGeneratorAsync(string source)\n+    {\n+        ImmutableArray<MetadataReference> frameworkReferences = await ReferencesHelper.DefaultTargetFrameworkReferences.ResolveAsync(LanguageNames.CSharp, CancellationToken.None);\n+\n+        CSharpCompilation compilation = CSharpCompilation.Create(\n+            assemblyName: \"CodeCoverageExclusionTests\",\n+            syntaxTrees: [CSharpSyntaxTree.ParseText(source, new CSharpParseOptions(LanguageVersion.Latest))],\n+            references: frameworkReferences.Concat(ReferencesHelper.GetReferences(ReferencesSet.MessagePack)),\n+            options: new CSharpCompilationOptions(OutputKind.DynamicallyLinkedLibrary));\n+\n+        var driver = CSharpGeneratorDriver.Create(new MessagePackGenerator());\n+        driver = (CSharpGeneratorDriver)driver.RunGeneratorsAndUpdateCompilation(compilation, out _, out _);\n+        GeneratorDriverRunResult result = driver.GetRunResult();\n+\n+        return result.GeneratedTrees\n+            .Select(tree => (tree.FilePath, tree.GetText().ToString()))\n+            .ToList();\n+    }\n+}","group":null},{"id":"h22","path":"tests/MessagePack.SourceGenerator.Tests/Resources/AdditionalAllowTypes/Formatters.MessagePack.GeneratedMessagePackResolver.TypeWithAutoGeneratedFormatterFormatter.g.cs","kind":"generated","area":"generated-snapshots","old_start":9,"old_len":6,"new_start":9,"new_len":9,"added":3,"removed":0,"text":"@@ -9,6 +9,9 @@ using MsgPack = global::MessagePack;\n namespace MessagePack {\n partial class GeneratedMessagePackResolver {\n \n+#if !NETSTANDARD2_0 && !NETFRAMEWORK\n+\t[global::System.Diagnostics.CodeAnalysis.ExcludeFromCodeCoverage]\n+#endif\n \tinternal sealed class TypeWithAutoGeneratedFormatterFormatter : MsgPack::Formatters.IMessagePackFormatter<global::TypeWithAutoGeneratedFormatter>\n \t{\n ","group":null},{"id":"h23","path":"tests/MessagePack.SourceGenerator.Tests/Resources/AdditionalAllowTypes/MessagePack.GeneratedMessagePackResolver.g.cs","kind":"generated","area":"generated-snapshots","old_start":9,"old_len":6,"new_start":9,"new_len":9,"added":3,"removed":0,"text":"@@ -9,6 +9,9 @@ using MsgPack = global::MessagePack;\n namespace MessagePack {\n \n /// <summary>A MessagePack resolver that uses generated formatters for types in this assembly.<\/summary>\n+#if !NETSTANDARD2_0 && !NETFRAMEWORK\n+[global::System.Diagnostics.CodeAnalysis.ExcludeFromCodeCoverage]\n+#endif\n partial class GeneratedMessagePackResolver : MsgPack::IFormatterResolver\n {\n \t/// <summary>An instance of this resolver that only returns formatters specifically generated for types in this assembly.<\/summary>","group":null},{"id":"h24","path":"tests/MessagePack.SourceGenerator.Tests/Resources/AdditionalAllowTypes/MessagePack.GeneratedMessagePackResolver.g.cs","kind":" th":"src/MessagePack.SourceGenerator/MessagePackGenerator.cs","area":"generator-other","kind":"src","status":"modified","added":36,"removed":3,"hunks":["h17","h18","h19"],"binary":false},{"path":"src/MessagePack.SourceGenerator/Transforms/FormatterTemplate.cs","area":"generator-templates","kind":"template-output","status":"modified","added":3,"removed":1,"hunks":["h20"],"binary":false},{"path":"src/MessagePack.SourceGenerator/Transforms/FormatterTemplate.tt","area":"generator-templates","kind":"template","status":"modified","added":1,"removed":1,"hunks":["h21"],"binary":false},{"path":"src/MessagePack.SourceGenerator/Transforms/StringKey/StringKeyFormatterTemplate.cs","area":"generator-templates","kind":"template-output","status":"modified","added":3,"removed":1,"hunks":["h22"],"binary":false},{"path":"src/MessagePack.SourceGenerator/Transforms/StringKey/StringKeyFormatterTemplate.tt","area":"generator-templates","kind":"template","status":"modified","added":1,"removed":1,"hunks":["h23"],"binary":false},{"path":"src/MessagePack.SourceGenerator/Utils/Constants.cs","area":"generator-other","kind":"src","status":"modified","added":2,"removed":0,"hunks":["h24"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExecutionTests/GeneratedFormatterForExternalTypes.cs","area":"tests","kind":"test","status":"added","added":50,"removed":0,"hunks":["h25"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExecutionTests/GeneratedFormatterForExternalTypesTests.cs","area":"tests","kind":"test","status":"added","added":95,"removed":0,"hunks":["h26"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExecutionTests/MessagePack.SourceGenerator.ExecutionTests.csproj","area":"tests","kind":"test","status":"modified","added":5,"removed":0,"hunks":["h27"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExternalTypes/ExternalPerson.cs","area":"test-fixtures","kind":"test","status":"added","added":15,"removed":0,"hunks":["h28"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExternalTypes/ExternalPoint.cs","area":"test-fixtures","kind":"test","status":"added","added":12,"removed":0,"hunks":["h29"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExternalTypes/ExternalWidget.cs","area":"test-fixtures","kind":"test","status":"added","added":15,"removed":0,"hunks":["h30"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.ExternalTypes/MessagePack.SourceGenerator.ExternalTypes.csproj","area":"test-fixtures","kind":"test","status":"added","added":17,"removed":0,"hunks":["h31"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.MapModeExecutionTests/MessagePack.SourceGenerator.MapModeExecutionTests.csproj","area":"tests","kind":"test","status":"modified","added":2,"removed":1,"hunks":["h32"],"binary":false},{"path":"tests/MessagePack.SourceGenerator.Tests/GeneratedMessagePackFormatterTests.cs","area":"tests","kind":"test","status":"added","added":210,"removed":0,"hunks":["h33"],"binary":false}],"hunks":[{"id":"h1","path":"README.md","kind":"doc","area":"docs","old_start":1636,"old_len":6,"new_start":1636,"new_len":58,"added":52,"removed":0,"text":"@@ -1636,6 +1636,58 @@ Two assembly-level attributes exist to help with mixing in your own custom forma\n \n Learn more about using a mix of your own custom formatters and automatically generated ones in [the Analyzer section](#analyzer).\n \n+### Formatters for types from other assemblies\n+\n+A type that comes from an assembly you cannot change, such as a dependency-free library, may have no MessagePack attributes at all.\n+You can still get a source-generated formatter for it by declaring a `partial` formatter class in your own project and marking it with `[GeneratedMessagePackFormatter]`:\n+\n+```cs\n+// ProjectA.MyObject lives in a library that does not reference MessagePack.\n+[GeneratedMessagePackFormatter]\n+public partial class MyObjectFormatter : IMessagePackFormatter<ProjectA.MyObject>\n+{\n+}\n+```\n+\n+The source generator writes the body of `MyObjectFormatter`, and the generated `GeneratedMessagePackResolver` registers it automatically.\n+Nothing needs to be added to `ProjectA`.\n+\n+By default the formatter serializes the type in *contractless* mode: every public, read-write instance property and field is serialized under its name as a string key.\n+Read-only members are skipped because they cannot be deserialized.\n+\n+To control keys and membership without touching the type, name a *surrogate* type in the attribute.\n+The surrogate's `[Key]` and `[IgnoreMember]` attributes describe the wire contract, and its members are matched to members of the formatted type by name and type.\n+The surrogate is only read at compile time and is never instantiated.\n+\n+```cs\n+public class MyObjectSurrogate\n+{\n+    [Key(0)]\n+    public int Id { get; set; }\n+\n+    [Key(1)]\n+    public string Label { get; set; }\n+\n+    [IgnoreMember]\n+    public string Secret { get; set; }\n+}\n+\n+[GeneratedMessagePackFormatter(SurrogateType = typeof(MyObjectSurrogate))]\n+public partial class MyObjectFormatter : IMessagePackFormatter<ProjectA.MyObject>\n+{\n+}\n+```\n+\n+When a surrogate is used, only the members it lists are serialized.\n+All of its keys must be integers or all must be strings.\n+\n+Limitations of this feature:\n+- Only classes and structs are supported. Generic types, abstract types, and unions from other assemblies are not.\n+- Deserialization uses an accessible parameterless constructor (any struct can be created without one). Constructor parameters are not matched, so types that only have a parameterized constructor are not supported yet.\n+- Nested member types are not generated from the formatter. They are resolved through the other resolvers in your composite resolver, as usual.\n+- Formatter diagnostics are reported as `MsgPack019` through `MsgPack022`, listed in the [analyzers](doc/analyzers/index.md).\n+\n+\n ### MagicOnion\n \n [MagicOnion](https://github.com/Cysharp/MagicOnion) is a code-first gRPC framework based on grpc-dotnet and MessagePack. gRPC usually communicates with Protocol Buffers using IDL. But MagicOnion uses MessagePack for C# and does not need IDL. When communicating C# to C#, schemaless (or rather C# classes as schema) is better than using IDL.","group":null},{"id":"h2","path":"doc/analyzers/MsgPack019.md","kind":"doc","area":"docs","old_start":0,"old_len":0,"new_start":1,"new_len":26,"added":26,"removed":0,"text":"@@ -0,0 +1,26 @@\n+# MsgPack019 Generated formatter must be partial\n+\n+A class marked with `[GeneratedMessagePackFormatter]` is the target of source generation. The generator writes the body of the formatter into the class, so the class must be declared `partial`.\n+\n+## Examples of patterns that are flagged by this analyzer\n+\n+```cs\n+[GeneratedMessagePackFormatter]\n+public class MyObjectFormatter : IMessagePackFormatter<ProjectA.MyObject> // Diagnostic reported here: not partial\n+{\n+    // ...\n+}\n+```\n+\n+## Typical fix\n+\n+Declare the class `partial` and leave its body empty:\n+\n+```cs\n+[GeneratedMessagePackFormatter]\n+public partial class MyObjectFormatter : IMessagePackFormatter<ProjectA.MyObject>\n+{\n+}\n+```\n+\n+Any nesting types that contain the formatter must also be declared `partial`.","group":null},{"id":"h3","path":"doc/analyzers/MsgPack020.md","kind":"doc","area":"docs","old_start":0,"old_len":0,"new_start":1,"new_len":23,"added":23,"removed":0,"text":"@@ -0,0 +1,23 @@\n+# MsgPack020 Generated formatter must implement IMessagePackFormatter<T>\n+\n+A class marked with `[GeneratedMessagePackFormatter]` identifies the data type to serialize by its `IMessagePackFormatter<T>` interface. The class must implement exactly one such interface.\n+\n+## Examples of patterns that are flagged by this analyzer\n+\n+```cs\n+[GeneratedMessagePackFormatter]\n+public partial class MyObjectFormatter // Diagnostic reported here: no IMessagePackFormatter<T>\n+{\n+}\n+```\n+\n+## Typical fix\n+\n+Implement `IMessagePackFormatter<T>` for the type to be serialized:\n+\n+```cs\n+[GeneratedMessagePackFormatter]\n+public partial class MyObjectFormatter : IMessagePackFormatter<ProjectA.MyObject>\n+{\n+}\n+```","group":null},{"id":"h4","path":"doc/analyzers/MsgPack021.md","kind":"doc","area":"docs","old_start":0,"old_len":0,"new_start":1,"new_len":23,"added":23,"removed":0,"text":"@@ -0,0 +1,23 @@\n+# MsgPack021 Generated formatter data type not supported\n+\n+The source generator writes formatters for non-generic, non-abstract classes and structs that the formatter can access. The data type named by the formatter's `IMessagePackFormatter<T>` interface must meet these requirements.\n+\n+## Examples of patterns that are flagged by this analyzer\n+\n+```cs\n+public abstract class MyBase { }\n+\n+[GeneratedMessagePackFormatter]\n+public partial class MyBaseFormatter : IMessagePackFormatter<MyBase> // Diagnostic reported here: abstract\n+{\n+}\n+\n+[GeneratedMessagePackFormatter]\n+public partial class ListFormatter : IMessagePackFormatter<List<int>> // Diagnostic reported here: generic\n+{\n+}\n+```\n+\n+## Typical fix\n+\n+Use a concrete, non-generic class or struct as the data type. For an abstract base type, use [`[Union]`](../../README.md#union) with the derived types instead.","group":null},{"id":"h5","path":"doc/analyzers/MsgPack022.md","kind":"doc","area":"docs","old_start":0,"old_len":0,"new_start":1,"new_len":31,"added":31,"removed":0,"text":"@@ -0,0 +1,31 @@\n+# MsgPack022 Surrogate member does not match the formatted type\n+\n+When `[GeneratedMessagePackFormatter(SurrogateType = typeof(...))]` is used, each keyed member of the surrogate must match a public, read-write instance member of the formatted type, with the same name and type.\n+\n+## Examples of patterns that are flagged by this analyzer\n+\n+```cs\n+// ProjectA.MyObject has `public int Id { get; set; }` and no `Missing` member.\n+public class MyObjectSurrogate\n+{\n+    [Key(0)]\n+    public int Missing { get; set; } // Diagnostic reported here\n+}\n+\n+[GeneratedMessagePackFormatter(SurrogateType = typeof(MyObjectSurrogate))]\n+public partial class MyObjectFormatter : IMessagePackFormatter<ProjectA.MyObject>\n+{\n+}\n+```\n+\n+## Typical fix\n+\n+Rename the surrogate member to match a public, read-write member of the formatted type, and make sure the types are identical:\n+\n+```cs\n+public class MyObjectSurrogate\n+{\n+    [Key(0)]\n+    public int Id { get; set; }\n+}\n+```","group":null},{"id":"h6","path":"doc/analyzers/index.md","kind":"doc","area":"docs","old_start":23,"old_len":5,"new_start":23,"new_len":9,"added":4,"removed":0,"text":"@@ -23,5 +23,9 @@ ID | Title\n [MsgPack016](MsgPack016.md) | KeyAttribute-derived attributes are not supported by AOT formatters\n [MsgPack017](MsgPack017.md) | Property with init accessor and initializer\n [MsgPack018](MsgPack018.md) | Unique names required in force map mode\n+[MsgPack019](MsgPack019.md) | Generated formatter must be partial\n+[MsgPack020](MsgPack020.md) | Generated formatter must implement `IMessagePackFormatter<T>`\n+[MsgPack021](MsgPack021.md) | Generated formatter data type not supported\n+[MsgPack022](MsgPack022.md) | Surrogate member does not match the formatted type\n \n [1]: https://nuget.org/packages/MessagePackAnalyzer","group":null},{"id":"h7","path":"src/MessagePack.Annotations/Attributes.cs","kind":"src","area":"runtime-serializer","old_start":139,"old_len":4,"new_start":139,"new_len":40,"added":36,"removed":0,"text":"@@ -139,4 +139,40 @@ namespace MessagePack\n             this.Arguments = arguments;\n         }\n     }\n+\n+    /// <summary>\n+    /// Marks a <see langword=\"partial\"/> class that implements <c>IMessagePackFormatter&lt;T&gt;<\/c> so that the MessagePack source generator\n+    /// writes the formatter implementation for <c>T<\/c>, even when <c>T<\/c> is declared in another assembly that cannot reference MessagePack.\n+    /// <\/summary>\n+    /// <remarks>\n+    /// <para>\n+    /// The formatted type <c>T<\/c> is serialized in contractless mode: every public, non-static, read-write instance property and field\n+    /// is serialized using its name as a string key. No attributes are required on <c>T<\/c>.\n+    /// <\/para>\n+    /// <para>\n+    /// To control keys and membership without touching <c>T<\/c>, set <see cref=\"SurrogateType\"/> to a type whose\n+    /// <see cref=\"KeyAttribute\"/> and <see cref=\"IgnoreMemberAttribute\"/> annotations describe the wire contract.\n+    /// The surrogate is only read at compile time and is never instantiated at run time.\n+    /// Surrogate members are matched to members of <c>T<\/c> by name.\n+    /// <\/para>\n+    /// <\/remarks>\n+    /// <example>\n+    /// <code>\n+    /// [GeneratedMessagePackFormatter]\n+    /// public partial class MyObjectFormatter : IMessagePackFormatter&lt;ProjectA.MyObject&gt; { }\n+    /// <\/code>\n+    /// <\/example>\n+    [AttributeUsage(AttributeTargets.Class, AllowMultiple = false, Inherited = false)]\n+    public class GeneratedMessagePackFormatterAttribute : Attribute\n+    {\n+        /// <summary>\n+        /// Gets or sets a type whose <see cref=\"KeyAttribute\"/> members define the keys and membership of the formatted type.\n+        /// <\/summary>\n+        /// <remarks>\n+        /// Each surrogate member that carries a <see cref=\"KeyAttribute\"/> must match a public, read-write instance member of the formatted type by name.\n+        /// Surrogate members that carry <see cref=\"IgnoreMemberAttribute\"/> are excluded.\n+        /// All keys in the surrogate must be the same kind (all integer or all string).\n+        /// <\/remarks>\n+        public Type? SurrogateType { get; set; }\n+    }\n }","group":null},{"id":"h8","path":"src/MessagePack.SourceGenerator/AnalyzerReleases.Unshipped.md","kind":"doc","area":"generator-other","old_start":23,"old_len":3,"new_start":23,"new_len":7,"added":4,"removed":0,"text":"@@ -23,3 +23,7 @@ MsgPack015 | Usage | Warning | MessagePackObjectAttribute.AllowPrivate should be\n MsgPack016 | Usage | Error | KeyAttribute-derived attributes are not supported by AOT formatters\n MsgPack017 | Usage | Warning | Property with init accessor and initializer\n MsgPack018 | Usage | Error | Unique names required in force map mode\n+MsgPack019 | Usage | Error | Generated formatter must be partial\n+MsgPack020 | Usage | Error | Generated formatter must implement IMessagePackFormatter<T>\n+MsgPack021 | Usage | Error | Generated formatter data type not supported\n+MsgPack022 | Usage | Error | Surrogate member does not match the formatted type","group":null},{"id":"h9","path":"src/MessagePack.SourceGenerator/Analyzers/MsgPack00xMessagePackAnalyzer.cs","kind":"src","area":"analyzer-core","old_start":29,"old_len":6,"new_start":29,"new_len":10,"added":4,"removed":0,"text":"@@ -29,6 +29,10 @@ public class MsgPack00xMessagePackAnalyzer : DiagnosticAnalyzer\n     public const string AOTDerivedKeyId = \"MsgPack016\";\n     public const string AOTInitPropertyId = \"MsgPack017\";\n     public const string CollidingMemberNamesInForceMapModeId = \"MsgPack018\";\n+    public const string GeneratedFormatterMustBePartialId = \"MsgPack019\";\n+    public const string GeneratedFormatterMustImplementFormatterId = \"MsgPack020\";\n+    public const string GeneratedFormatterDataTypeNotSupportedId = \"MsgPack021\";\n+    public const string SurrogateMemberNotFoundId = \"MsgPack022\";\n \n     internal const string Category = \"Usage\";\n ","group":null},{"id":"h10","path":"src/MessagePack.SourceGenerator/Analyzers/MsgPack00xMessagePackAnalyzer.cs","kind":"src","area":"analyzer-core","old_start":311,"old_len":6,"new_start":315,"new_len":42,"added":36,"removed":0,"text":"@@ -311,6 +315,42 @@ public class MsgPack00xMessagePackAnalyzer : DiagnosticAnalyzer\n         isEnabledByDefault: true,\n         helpLinkUri: AnalyzerUtilities.GetHelpLink(CollidingMemberNamesInForceMapModeId));\n \n+    public static readonly DiagnosticDescriptor GeneratedFormatterMustBePartial = new(\n+        id: GeneratedFormatterMustBePartialId,\n+        title: \"Generated formatter must be partial\",\n+        category: Category,\n+        messageFormat: \"The formatter '{0}' is marked with [GeneratedMessagePackFormatter] and must be declared 'partial' so the source generator can write its implementation\",\n+        defaultSeverity: DiagnosticSeverity.Error,\n+        isEnabledByDefault: true,\n+        helpLinkUri: AnalyzerUtilities.GetHelpLink(GeneratedFormatterMustBePartialId));\n+\n+    public static readonly DiagnosticDescriptor GeneratedFormatterMustImplementFormatter = new(\n+        id: GeneratedFormatterMustImplementFormatterId,\n+        title: \"Generated formatter must implement IMessagePackFormatter<T>\",\n+        category: Category,\n+        messageFormat: \"The formatter '{0}' is marked with [GeneratedMessagePackFormatter] but does not implement IMessagePackFormatter<T> for exactly one data type\",\n+        defaultSeverity: DiagnosticSeverity.Error,\n+        isEnabledByDefault: true,\n+        helpLinkUri: AnalyzerUtilities.GetHelpLink(GeneratedFormatterMustImplementFormatterId));\n+\n+    public static readonly DiagnosticDescriptor GeneratedFormatterDataTypeNotSupported = new(\n+        id: GeneratedFormatterDataTypeNotSupportedId,\n+        title: \"Generated formatter data type not supported\",\n+        category: Category,\n+        messageFormat: \"The formatter '{0}' cannot generate a formatter for '{1}': only accessible, non-generic, non-abstract classes and structs are supported\",\n+        defaultSeverity: DiagnosticSeverity.Error,\n+        isEnabledByDefault: true,\n+        helpLinkUri: AnalyzerUtilities.GetHelpLink(GeneratedFormatterDataTypeNotSupportedId));\n+\n+    public static readonly DiagnosticDescriptor SurrogateMemberNotFound = new(\n+        id: SurrogateMemberNotFoundId,\n+        title: \"Surrogate member does not match the formatted type\",\n+        category: Category,\n+        messageFormat: \"The surrogate member '{0}' has no matching public, read-write instance member with the same name and type on '{1}'\",\n+        defaultSeverity: DiagnosticSeverity.Error,\n+        isEnabledByDefault: true,\n+        helpLinkUri: AnalyzerUtilities.GetHelpLink(SurrogateMemberNotFoundId));\n+\n     public override ImmutableArray<DiagnosticDescriptor> SupportedDiagnostics { get; } = ImmutableArray.Create(\n         TypeMustBeMessagePackObject,\n         MessageFormatterMustBeMessagePackFormatter,","group":null},{"id":"h11","path":"src/MessagePack.SourceGenerator/Analyzers/MsgPack00xMessagePackAnalyzer.cs","kind":"src","area":"analyzer-core","old_start":338,"old_len":7,"new_start":378,"new_len":11,"added":5,"removed":1,"text":"@@ -338,7 +378,11 @@ public class MsgPack00xMessagePackAnalyzer : DiagnosticAnalyzer\n         InaccessibleDataType,\n         NullableReferenceTypeFormatter,\n         MessagePackObjectAllowPrivateRequired,\n-        CollidingMemberNamesInForceMapMode);\n+        CollidingMemberNamesInForceMapMode,\n+        GeneratedFormatterMustBePartial,\n+        GeneratedFormatterMustImplementFormatter,\n+        GeneratedFormatterDataTypeNotSupported,\n+        SurrogateMemberNotFound);\n \n     public override void Initialize(AnalysisContext context)\n     {","group":null},{"id":"h12","path":"src/MessagePack.SourceGenerator/CodeAnalysis/GeneratedFormatterCollector.cs","kind":"src","area":"analyzer-core","old_start":0,"old_len":0,"new_start":1,"new_len":300,"added":300,"removed":0,"text":"@@ -0,0 +1,300 @@\n+// Copyright (c) All contributors. All rights reserved.\n+// Licensed under the MIT license. See LICENSE file in the project root for full license information.\n+\n+using System.Collections.Immutable;\n+using MessagePack.SourceGenerator.Analyzers;\n+using Microsoft.CodeAnalysis;\n+using Microsoft.CodeAnalysis.CSharp;\n+using Microsoft.CodeAnalysis.CSharp.Syntax;\n+\n+namespace MessagePack.SourceGenerator.CodeAnalysis;\n+\n+/// <summary>\n+/// Builds the serialization model for a partial formatter marked with <c>[GeneratedMessagePackFormatter]<\/c>.\n+/// The formatted type may come from an assembly that carries no MessagePack attributes, so its members are read\n+/// in contractless mode, or through the keys declared on an optional surrogate type.\n+/// <\/summary>\n+internal static class GeneratedFormatterCollector\n+{\n+    private static readonly SymbolDisplayFormat BinaryWriteTypeFormat = new(\n+        genericsOptions: SymbolDisplayGenericsOptions.IncludeTypeParameters,\n+        miscellaneousOptions: SymbolDisplayMiscellaneousOptions.ExpandNullable,\n+        typeQualificationStyle: SymbolDisplayTypeQualificationStyle.NameOnly);\n+\n+    /// <summary>\n+    /// Creates the model for one generated formatter.\n+    /// <\/summary>\n+    /// <param name=\"compilation\">The compilation that contains the formatter.<\/param>\n+    /// <param name=\"options\">The analyzer options for the compilation.<\/param>\n+    /// <param name=\"referenceSymbols\">The MessagePack reference symbols.<\/param>\n+    /// <param name=\"reportDiagnostic\">Receives diagnostics about the formatter. May be <see langword=\"null\"/>.<\/param>\n+    /// <param name=\"formatter\">The user-declared partial formatter class.<\/param>\n+    /// <param name=\"surrogate\">The surrogate type, or <see langword=\"null\"/> for contractless mode.<\/param>\n+    /// <param name=\"cancellationToken\">A cancellation token.<\/param>\n+    /// <returns>The model, or <see langword=\"null\"/> if the formatter cannot be generated.<\/returns>\n+    internal static FullModel? Collect(\n+        Compilation compilation,\n+        AnalyzerOptions options,\n+        ReferenceSymbols referenceSymbols,\n+        Action<Diagnostic>? reportDiagnostic,\n+        INamedTypeSymbol formatter,\n+        INamedTypeSymbol? surrogate,\n+        CancellationToken cancellationToken)\n+    {\n+        Location location = formatter.Locations.FirstOrDefault() ?? Location.None;\n+        string formatterName = formatter.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat);\n+\n+        if (!IsPartial(formatter, cancellationToken))\n+        {\n+            reportDiagnostic?.Invoke(Diagnostic.Create(MsgPack00xMessagePackAnalyzer.GeneratedFormatterMustBePartial, location, formatterName));\n+            return null;\n+        }\n+\n+        INamedTypeSymbol? openFormatterInterface = compilation.GetTypeByMetadataName($\"{Constants.IMessagePackFormatterInterfaceNamespace}.{Constants.IMessagePackFormatterInterfaceName}`1\");\n+        ImmutableArray<INamedTypeSymbol> formatterInterfaces = formatter.AllInterfaces\n+            .Where(i => i.IsGenericType && SymbolEqualityComparer.Default.Equals(i.OriginalDefinition, openFormatterInterface))\n+            .ToImmutableArray();\n+        if (formatterInterfaces.Length != 1)\n+        {\n+            reportDiagnostic?.Invoke(Diagnostic.Create(MsgPack00xMessagePackAnalyzer.GeneratedFormatterMustImplementFormatter, location, formatterName));\n+            return null;\n+        }\n+\n+        ITypeSymbol dataTypeSymbol = formatterInterfaces[0].TypeArguments[0];\n+        if (dataTypeSymbol is not INamedTypeSymbol { IsGenericType: false, IsAbstract: false } type\n+            || type.TypeKind is not (TypeKind.Class or TypeKind.Struct)\n+            || !compilation.IsSymbolAccessibleWithin(type, formatter))\n+        {\n+            reportDiagnostic?.Invoke(Diagnostic.Create(\n+                MsgPack00xMessagePackAnalyzer.GeneratedFormatterDataTypeNotSupported,\n+                location,\n+                formatterName,\n+                dataTypeSymbol.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat)));\n+            return null;\n+        }\n+\n+        bool isClass = type.TypeKind == TypeKind.Class;\n+        if (isClass && !type.InstanceConstructors.Any(c => c.Parameters.Length == 0 && compilation.IsSymbolAccessibleWithin(c, formatter)))\n+        {\n+            reportDiagnostic?.Invoke(Diagnostic.Create(MsgPack00xMessagePackAnalyzer.NoDeserializingConstructor, location));\n+            return null;\n+        }\n+\n+        bool hasCallbackReceiver = type.AllInterfaces.Any(i => SymbolEqualityComparer.Default.Equals(i, referenceSymbols.IMessagePackSerializationCallbackReceiver));\n+        bool needsCast = hasCallbackReceiver && type.GetMembers().OfType<IMethodSymbol>().Any(m =>\n+            m.ExplicitInterfaceImplementations.Length > 0 && (m.Name == \"OnBeforeSerialize\" || m.Name == \"OnAfterDeserialize\"));\n+\n+        IReadOnlyList<MemberSerializationInfo>? members;\n+        bool isIntKey;\n+        if (surrogate is null)\n+        {\n+            members = CreateContractlessMembers(type);\n+            isIntKey = false;\n+        }\n+        else\n+        {\n+            members = CreateSurrogateMembers(type, surrogate, referenceSymbols, reportDiagnostic, location, out isIntKey);\n+        }\n+\n+        if (members is null)\n+        {\n+            return null;\n+        }\n+\n+        ObjectSerializationInfo info = ObjectSerializationInfo.Create(\n+            type,\n+            isClass: isClass,\n+            nestedFormatterRequired: false,\n+            genericTypeParameters: Array.Empty<GenericTypeParameterInfo>(),\n+            constructorParameters: Array.Empty<MemberSerializationInfo>(),\n+            isIntKey: isIntKey,\n+            members: members.ToArray(),\n+            hasIMessagePackSerializationCallbackReceiver: hasCallbackReceiver,\n+            needsCastOnAfter: needsCast,\n+            needsCastOnBefore: needsCast,\n+            resolverOptions: options.Generator.Resolver) with\n+        {\n+            Formatter = new QualifiedNamedTypeName(formatter),\n+            IsUserDeclaredFormatter = true,\n+        };\n+\n+        return FullModel.Empty with\n+        {\n+            ObjectInfos = ImmutableSortedSet.Create(info),\n+            Options = options,\n+        };\n+    }\n+\n+    /// <summary>\n+    /// Contractless mode: every public, read-write instance property and field is serialized under its name as a string key.\n+    /// <\/summary>\n+    private static IReadOnlyList<MemberSerializationInfo> CreateContractlessMembers(INamedTypeSymbol type)\n+    {\n+        List<ISymbol> targets = GetInstanceMembers(type).Where(IsPublicReadWrite).OrderBy(m => m.Name, StringComparer.Ordinal).ToList();\n+        List<MemberSerializationInfo> members = new(targets.Count);\n+        for (int i = 0; i < targets.Count; i++)\n+        {\n+            members.Add(CreateMember(targets[i], intKey: i, stringKey: targets[i].Name));\n+        }\n+\n+        return members;\n+    }\n+\n+    /// <summary>\n+    /// Surrogate mode: keys and membership come from the surrogate's <c>[Key]<\/c> and <c>[IgnoreMember]<\/c> annotations.\n+    /// Each keyed surrogate member is matched by name, and type, to a public read-write member of the formatted type.\n+    /// <\/summary>\n+    private static IReadOnlyList<MemberSerializationInfo>? CreateSurrogateMembers(\n+        INamedTypeSymbol type,\n+        INamedTypeSymbol surrogate,\n+        ReferenceSymbols referenceSymbols,\n+        Action<Diagnostic>? reportDiagnostic,\n+        Location location,\n+        out bool isIntKey)\n+    {\n+        isIntKey = false;\n+        bool? keyKindIsInt = null;\n+        HashSet<object> claimedKeys = new();\n+        List<MemberSerializationInfo> members = new();\n+        List<ISymbol> targetMembers = GetInstanceMembers(type);\n+\n+        foreach (ISymbol surrogateMember in GetInstanceMembers(surrogate))\n+        {\n+            ImmutableArray<AttributeData> attributes = surrogateMember.GetAttributes();\n+            if (attributes.Any(a => SymbolEqualityComparer.Default.Equals(a.AttributeClass, referenceSymbols.IgnoreAttribute)))\n+            {\n+                continue;\n+            }\n+\n+            AttributeData? keyAttribute = attributes.FirstOrDefault(a => SymbolEqualityComparer.Default.Equals(a.AttributeClass, referenceSymbols.KeyAttribute));\n+            object? key = keyAttribute is { ConstructorArguments.Length: 1 } ? keyAttribute.ConstructorArguments[0].Value : null;\n+            if (key is not (int or string))\n+            {\n+                reportDiagnostic?.Invoke(Diagnostic.Create(\n+                    MsgPack00xMessagePackAnalyzer.MemberNeedsKey,\n+                    surrogateMember.Locations.FirstOrDefault() ?? location,\n+                    surrogate.Name,\n+                    surrogateMember.Name));\n+                return null;\n+            }\n+\n+            bool memberIsIntKey = key is int;\n+            keyKindIsInt ??= memberIsIntKey;\n+            if (keyKindIsInt != memberIsIntKey)\n+            {\n+                reportDiagnostic?.Invoke(Diagnostic.Create(MsgPack00xMessagePackAnalyzer.DoNotMixStringAndIntKeys, surrogateMember.Locations.FirstOrDefault() ?? location));\n+                return null;\n+            }\n+\n+            ISymbol? target = targetMembers.FirstOrDefault(m => m.Name == surrogateMember.Name);\n+            if (target is null || !IsPublicReadWrite(target) || !SymbolEqualityComparer.Default.Equals(GetMemberType(target), GetMemberType(surrogateMember)))\n+            {\n+                reportDiagnostic?.Invoke(Diagnostic.Create(\n+                    MsgPack00xMessagePackAnalyzer.SurrogateMemberNotFound,\n+                    surrogateMember.Locations.FirstOrDefault() ?? location,\n+                    surrogateMember.Name,\n+                    type.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat)));\n+                return null;\n+            }\n+\n+            if (!claimedKeys.Add(key))\n+            {\n+                reportDiagnostic?.Invoke(Diagnostic.Create(MsgPack00xMessagePackAnalyzer.KeysMustBeUnique, surrogateMember.Locations.FirstOrDefault() ?? location));\n+                return null;\n+            }\n+\n+            members.Add(key is int intKey\n+                ? CreateMember(target, intKey: intKey, stringKey: target.Name)\n+                : CreateMember(target, intKey: members.Count, stringKey: (string)key));\n+        }\n+\n+        isIntKey = keyKindIsInt ?? false;\n+        return members;\n+    }\n+\n+    private static MemberSerializationInfo CreateMember(ISymbol target, int intKey, string stringKey)\n+    {\n+        ITypeSymbol memberType = GetMemberType(target);\n+        bool isProperty = target is IPropertySymbol;\n+        bool isInitOnly = target is IPropertySymbol { SetMethod.IsInitOnly: true };\n+        bool isRequired = target switch\n+        {\n+            IPropertySymbol property => property.IsRequired,\n+            IFieldSymbol field => field.IsRequired,\n+            _ => false,\n+        };\n+\n+        return new MemberSerializationInfo(\n+            IsProperty: isProperty,\n+            IsWritable: true,\n+            IsReadable: true,\n+            IsInitOnly: isInitOnly,\n+            IsRequired: isRequired,\n+            IntKey: intKey,\n+            StringKey: stringKey,\n+            Name: target.Name,\n+            Type: memberType.ToDisplayString(SymbolDisplayFormat.FullyQualifiedFormat),\n+            ShortTypeName: memberType.ToDisplayString(BinaryWriteTypeFormat),\n+            CustomFormatter: null)\n+        {\n+            // Members of the formatted type are never colliding with a base-type member of the same name here,\n+            // because GetInstanceMembers keeps only the most derived member of each name.\n+            DeclaringType = null,\n+        };\n+    }\n+\n+    /// <summary>\n+    /// Enumerates the instance fields and properties of a type and its base types, keeping only the most derived member of each name.\n+    /// <\/summary>\n+    private static List<ISymbol> GetInstanceMembers(INamedTypeSymbol type)\n+    {\n+        HashSet<string> seen = new(StringComparer.Ordinal);\n+        List<ISymbol> result = new();\n+        for (INamedTypeSymbol? current = type; current is not null && current.SpecialType != SpecialType.System_Object; current = current.BaseType)\n+        {\n+            foreach (ISymbol member in current.GetMembers())\n+            {\n+                if (member.IsStatic || member.IsImplicitlyDeclared || member is not (IPropertySymbol or IFieldSymbol))\n+                {\n+                    continue;\n+                }\n+\n+                if (member is IPropertySymbol { IsIndexer: true })\n+                {\n+                    continue;\n+                }\n+\n+                if (seen.Add(member.Name))\n+                {\n+                    result.Add(member);\n+                }\n+            }\n+        }\n+\n+        return result;\n+    }\n+\n+    private static bool IsPublicReadWrite(ISymbol member) => member switch\n+    {\n+        IPropertySymbol property => property.DeclaredAccessibility == Accessibility.Public\n+            && property.GetMethod is { DeclaredAccessibility: Accessibility.Public }\n+            && property.SetMethod is { DeclaredAccessibility: Accessibility.Public },\n+        IFieldSymbol field => field.DeclaredAccessibility == Accessibility.Public && !field.IsReadOnly && !field.IsConst,\n+        _ => false,\n+    };\n+\n+    private static ITypeSymbol GetMemberType(ISymbol member) => member switch\n+    {\n+        IPropertySymbol property => property.Type,\n+        IFieldSymbol field => field.Type,\n+        _ => throw new ArgumentOutOfRangeException(nameof(member)),\n+    };\n+\n+    private static bool IsPartial(INamedTypeSymbol symbol, CancellationToken cancellationToken)\n+    {\n+        return symbol.DeclaringSyntaxReferences\n+            .Select(r => r.GetSyntax(cancellationToken))\n+            .OfType<ClassDeclarationSyntax>()\n+            .Any(c => c.Modifiers.Any(SyntaxKind.PartialKeyword));\n+    }\n+}","group":null},{"id":"h13","path":"src/MessagePack.SourceGenerator/CodeAnalysis/GeneratedFormatterRequest.cs","kind":"src","area":"analyzer- >>\n <# TransformUtilities.EmitTypeConstraints(Info.Formatter, this.Write); #>\n \t{\n <# foreach (var item in Info.Members) { #>","group":null},{"id":"h24","path":"src/MessagePack.SourceGenerator/Utils/Constants.cs","kind":"src","area":"generator-other","old_start":14,"old_len":6,"new_start":14,"new_len":8,"added":2,"removed":0,"text":"@@ -14,6 +14,8 @@ internal static class Constants\n     internal const string MessagePackAssumedFormattableAttributeName = \"MessagePackAssumedFormattableAttribute\";\n     internal const string MessagePackObjectAttributeName = \"MessagePackObjectAttribute\";\n     internal const string MessagePackUnionAttributeName = \"UnionAttribute\";\n+    internal const string GeneratedMessagePackFormatterAttributeName = \"GeneratedMessagePackFormatterAttribute\";\n+    internal const string GeneratedMessagePackFormatterSurrogatePropertyName = \"SurrogateType\";\n     internal const string SuppressSourceGenerationPropertyName = \"SuppressSourceGeneration\";\n     internal const string AllowPrivatePropertyName = \"AllowPrivate\";\n ","group":null},{"id":"h25","path":"tests/MessagePack.SourceGenerator.ExecutionTests/GeneratedFormatterForExternalTypes.cs","kind":"test","area":"tests","old_start":0,"old_len":0,"new_start":1,"new_len":50,"added":50,"removed":0,"text":"@@ -0,0 +1,50 @@\n+// Copyright (c) All contributors. All rights reserved.\n+// Licensed under the MIT license. See LICENSE file in the project root for full license information.\n+\n+using ExternalTypes.Library;\n+using MessagePack.Formatters;\n+\n+// Formatter bodies for types from ExternalTypes that carry no MessagePack attributes.\n+// The source generator writes the members of each partial class (https://github.com/MessagePack-CSharp/MessagePack-CSharp/issues/2129).\n+[GeneratedMessagePackFormatter]\n+public partial class ExternalPersonFormatter : IMessagePackFormatter<ExternalPerson>\n+{\n+}\n+\n+[GeneratedMessagePackFormatter]\n+public partial class ExternalPointFormatter : IMessagePackFormatter<ExternalPoint>\n+{\n+}\n+\n+[GeneratedMessagePackFormatter(SurrogateType = typeof(ExternalWidgetSurrogate))]\n+public partial class ExternalWidgetFormatter : IMessagePackFormatter<ExternalWidget>\n+{\n+}\n+\n+/// <summary>\n+/// Describes the wire contract of <see cref=\"ExternalWidget\"/>. It is only read at compile time and is never instantiated.\n+/// <\/summary>\n+public class ExternalWidgetSurrogate\n+{\n+    [Key(3)]\n+    public int Id { get; set; }\n+\n+    [Key(7)]\n+    public string Name { get; set; } = string.Empty;\n+\n+    [IgnoreMember]\n+    public int Internal { get; set; }\n+}\n+\n+/// <summary>\n+/// A serializable type that refers to <see cref=\"ExternalPerson\"/>, whose formatter is generated by <see cref=\"ExternalPersonFormatter\"/>.\n+/// <\/summary>\n+[MessagePackObject]\n+public class ContainsExternalPerson\n+{\n+    [Key(0)]\n+    public ExternalPerson Person { get; set; }\n+\n+    [Key(1)]\n+    public ExternalWidget Widget { get; set; }\n+}","group":null},{"id":"h26","path":"tests/MessagePack.SourceGenerator.ExecutionTests/GeneratedFormatterForExternalTypesTests.cs","kind":"test","area":"tests","old_start":0,"old_len":0,"new_start":1,"new_len":95,"added":95,"removed":0,"text":"@@ -0,0 +1,95 @@\n+// Copyright (c) All contributors. All rights reserved.\n+// Licensed under the MIT license. See LICENSE file in the project root for full license information.\n+\n+using ExternalTypes.Library;\n+\n+public class GeneratedFormatterForExternalTypesTests\n+{\n+    private static readonly MessagePackSerializerOptions Options = MessagePackSerializerOptions.Standard\n+        .WithResolver(CompositeResolver.Create(GeneratedMessagePackResolver.Instance, StandardResolver.Instance));\n+\n+    [Fact]\n+    public void ContractlessClassRoundTrips()\n+    {\n+        var person = new ExternalPerson { Id = 7, Label = \"seven\" };\n+\n+        byte[] bytes = MessagePackSerializer.Serialize(person, Options);\n+        ExternalPerson result = MessagePackSerializer.Deserialize<ExternalPerson>(bytes, Options);\n+\n+        Assert.Equal(7, result.Id);\n+        Assert.Equal(\"seven\", result.Label);\n+    }\n+\n+    [Fact]\n+    public void ContractlessClassUsesStringKeysForPublicReadWriteMembers()\n+    {\n+        byte[] bytes = MessagePackSerializer.Serialize(new ExternalPerson { Id = 1, Label = \"x\" }, Options);\n+\n+        // A fixmap with two entries: Id and Label. The read-only Doubled member is not serialized.\n+        Assert.Equal(0x82, bytes[0]);\n+        string json = MessagePackSerializer.ConvertToJson(bytes, Options);\n+        Assert.Contains(\"\\\"Id\\\":1\", json);\n+        Assert.Contains(\"\\\"Label\\\":\\\"x\\\"\", json);\n+        Assert.DoesNotContain(\"Doubled\", json);\n+    }\n+\n+    [Fact]\n+    public void ContractlessClassNullRoundTrips()\n+    {\n+        byte[] bytes = MessagePackSerializer.Serialize(default(ExternalPerson), Options);\n+        Assert.Null(MessagePackSerializer.Deserialize<ExternalPerson>(bytes, Options));\n+    }\n+\n+    [Fact]\n+    public void ContractlessStructRoundTrips()\n+    {\n+        var point = new ExternalPoint { X = 3, Y = -4 };\n+\n+        ExternalPoint result = MessagePackSerializer.Deserialize<ExternalPoint>(MessagePackSerializer.Serialize(point, Options), Options);\n+\n+        Assert.Equal(3, result.X);\n+        Assert.Equal(-4, result.Y);\n+    }\n+\n+    [Fact]\n+    public void SurrogateControlsKeysAndMembership()\n+    {\n+        var widget = new ExternalWidget { Id = 1, Name = \"w\", Internal = 99 };\n+\n+        byte[] bytes = MessagePackSerializer.Serialize(widget, Options);\n+\n+        // The surrogate uses integer keys 3 and 7, so the array has MaxKey + 1 = 8 slots.\n+        var reader = new MessagePackReader(bytes);\n+        Assert.Equal(8, reader.ReadArrayHeader());\n+\n+        ExternalWidget result = MessagePackSerializer.Deserialize<ExternalWidget>(bytes, Options);\n+        Assert.Equal(1, result.Id);\n+        Assert.Equal(\"w\", result.Name);\n+        Assert.Equal(0, result.Internal);\n+    }\n+\n+    [Fact]\n+    public void MessagePackObjectCanContainExternalTypes()\n+    {\n+        var value = new ContainsExternalPerson\n+        {\n+            Person = new ExternalPerson { Id = 5, Label = \"five\" },\n+            Widget = new ExternalWidget { Id = 6, Name = \"six\" },\n+        };\n+\n+        ContainsExternalPerson result = MessagePackSerializer.Deserialize<ContainsExternalPerson>(MessagePackSerializer.Serialize(value, Options), Options);\n+\n+        Assert.Equal(5, result.Person.Id);\n+        Assert.Equal(\"five\", result.Person.Label);\n+        Assert.Equal(6, result.Widget.Id);\n+        Assert.Equal(\"six\", result.Widget.Name);\n+    }\n+\n+    [Fact]\n+    public void GeneratedFormattersAreRegisteredInGeneratedResolver()\n+    {\n+        Assert.IsType<ExternalPersonFormatter>(GeneratedMessagePackResolver.Instance.GetFormatter<ExternalPerson>());\n+        Assert.IsType<ExternalPointFormatter>(GeneratedMessagePackResolver.Instance.GetFormatter<ExternalPoint>());\n+        Assert.IsType<ExternalWidgetFormatter>(GeneratedMessagePackResolver.Instance.GetFormatter<ExternalWidget>());\n+    }\n+}","group":null},{"id":"h27","path":"tests/MessagePack.SourceGenerator.ExecutionTests/MessagePack.SourceGenerator.ExecutionTests.csproj","kind":"test","area":"tests","old_start":14,"old_len":5,"new_start":14,"new_len":10,"added":5,"removed":0,"text":"@@ -14,5 +14,10 @@\n     <PackageReference Include=\"xunit.runner.visualstudio\" />\n   <\/ItemGroup>\n \n+  <ItemGroup>\n+    <\!-- Types from an assembly that does not reference MessagePack (https://github.com/MessagePack-CSharp/MessagePack-CSharp/issues/2129). -->\n+    <ProjectReference Include=\"..\\MessagePack.SourceGenerator.ExternalTypes\\MessagePack.SourceGenerator.ExternalTypes.csproj\" />\n+  <\/ItemGroup>\n+\n   <Import Project=\"..\\SourceGeneratorConsumer.targets\" />\n <\/Project>","group":null},{"id":"h28","path ogate type in the consuming assembly.<\/summary>\n+public class ExternalWidget\n+{\n+    public int Id { get; set; }\n+\n+    public string Name { get; set; }\n+\n+    /// <summary>Gets or sets a value that is not part of the surrogate's contract, so it is not serialized.<\/summary>\n+    public int Internal { get; set; }\n+}","group":null},{"id":"h31","path":"tests/MessagePack.SourceGenerator.ExternalTypes/MessagePack.SourceGenerator.ExternalTypes.csproj","kind":"test","area":"test-fixtures","old_start":0,"old_len":0,"new_start":1,"new_len":17,"added":17,"removed":0,"text":"@@ -0,0 +1,17 @@\n+<Project Sdk=\"Microsoft.NET.Sdk\">\n+\n+  <\!--\n+    This assembly deliberately does NOT reference MessagePack.\n+    It models a dependency-free library (Project A in https://github.com/MessagePack-CSharp/MessagePack-CSharp/issues/2129)\n+    whose types are serialized by generated formatters declared in a consuming assembly.\n+  -->\n+  <PropertyGroup>\n+    <TargetFramework>net8.0<\/TargetFramework>\n+    <ImplicitUsings>disable<\/ImplicitUsings>\n+    <Nullable>disable<\/Nullable>\n+    <IsTestProject>false<\/IsTestProject>\n+    <NonShipping>true<\/NonShipping>\n+    <NoWarn>$(NoWarn);CS1591<\/NoWarn>\n+  <\/PropertyGroup>\n+\n+<\/Project>","group":null},{"id":"h32","path":"tests/MessagePack.SourceGenerator.MapModeExecutionTests/MessagePack.SourceGenerator.MapModeExecutionTests.csproj","kind":"test","area":"tests","old_start":10,"old_len":7,"new_start":10,"new_len":8,"added":2,"removed":1,"text":"@@ -10,7 +10,8 @@\n   <\/PropertyGroup>\n \n   <ItemGroup>\n-    <Compile Include=\"..\\MessagePack.SourceGenerator.ExecutionTests\\**\\*.cs\" Exclude=\"..\\MessagePack.SourceGenerator.ExecutionTests\\**\\GeneratedMessagePackResolver.cs\" />\n+    <\!-- GeneratedFormatterForExternalTypes*.cs need the ExternalTypes assembly, which this project does not reference. -->\n+    <Compile Include=\"..\\MessagePack.SourceGenerator.ExecutionTests\\**\\*.cs\" Exclude=\"..\\MessagePack.Sou .3947,"basis":"line-level: flagged src/template hunks whole; doc/test hunks only lines near cited evidence gaps","inputs":{"xray":true,"regen":false,"refusals":true,"claims":true},"provisional":false,"hunk_level_lines":226},"checked":[{"claim":"C1","text":"For a [MessagePackObject] type whose member is a closed generic value type from a referenced assembly, the analyzer no longer throws IndexOutOfRangeException (AD0001).","by":"timemachine (executed)","evidence_level":"E3","evidence_sha256":"bb9259a1ff4c222b511554a5cd362ce371b38b1711fbade8ac7b49fb07a7826e"},{"claim":"C2","text":"For the same input the generator no longer throws (no CS8785) and a GeneratedMessagePackResolver is emitted.","by":"timemachine (executed)","evidence_level":"E3","evidence_sha256":"bb9259a1ff4c222b511554a5cd362ce371b38b1711fbade8ac7b49fb07a7826e"}],"not_checked":[{"what":"claim C3: Only struct<T> and record struct<T> from metadata change behaviour; struct, record struct, class<T> and record class<T> from metadata behave exactly as before.","why":"evidence level E1, status refused"},{"what":"claim C4: No diagnostic that was reported before the change for a type declared in source is lost, moved or changed by the new constructor-level filter.","why":"evidence level E2, status refused"},{"what":"claim C5: No safety-relevant diagnostic is silently dropped for types the user controls.","why":"evidence level E1, status refused"},{"what":"claim C6: Diagnostics about the members of a closed generic type from a referenced assembly are reported by the assembly that defines it, so any problem must be fixed there.","why":"evidence level E1, status refused"},{"what":"claim C7: An unattributed public member of a type defined in a referenced assembly is reported by the project that defines that type.","why":"evidence level E1, status refused"},{"what":"claim C8: Dropping a diagnostic that has no location in the compilation is required because analyzers are not permitted to report against a location that do
