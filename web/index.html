t was checked, what was not, and what risk they accept. That gives accountability and a record. It does not make the change safe. Each code area earns lighter review from its track record and loses it after an escape or a missed canary.\n\n## Evidence levels\nCode assigns these. The model does not.\n\n| Level | Meaning | Example from #2283 |\n|---|---|---|\n| E3 Executed | Something ran and the log is saved | The 3 new tests fail on the old code with the issue's `IndexOutOfRangeException`, and pass on the new code |\n| E2 Mechanical | A deterministic check passed | Reverting a hunk breaks a test (X-Ray), or every hunk of a snapshot file matches the expected pattern |\n| E1 Argued | Reasoned, citations validated, nothing executed | The README says the defining assembly reports the dropped diagnostics |\n| E0 Unsupported | Nothing to check | A claim whose citation does not exist at that line |\n| Refused | The reviewer declines and asks the owner | \"This change drops diagnostics for metadata types. Is that acceptable?\" |\n\nOnly a fail-to-pass run on the old and new code earns E3. X-Ray results are E2. No confidence percentage appears anywhere.\n\n## Principles and what each one costs\n| # | Principle | Cost we accept |\n|---|---|---|\n| P1 | Review claims. The unit is a claim tied to a requirement ID. | Extraction can be wrong, so every requirement item must be covered and uncovered ones are shown. |\n| P2 | Evidence decides. Levels E3 to E0. Confidence never counts as evidence. | More compute and wall-clock time than asking a model whether the PR looks fine. |\n| P3 | The reviewer may refuse. Fixed rules force a refusal on product decisions, silent suppression, unproven root causes, security areas and evidence gaps. | More questions for the owner. Each is written to be answerable in about a minute. |\n| P4 | Route by evidence gaps and blast radius. Lanes L0 to L3, with a ceiling for security areas. | A rule-based router can misroute. We check it with a backtest and with escape tracking per area. |\n| P5 | Check independently. The author's commit message and docs are claims to test. A second model family and a separate prosecutor pass try to falsify them. | A second pass costs more. |\n| P6 | A human signs. No lane auto-merges. | A signature is accountability and a record, not safety. Owners can still rubber-stamp, so the residual risk is written in their own words. We would measure time on the receipt, edits to the residual-risk text and later disagreement with AI findings. |\n| P7 | Trust is per area and measured. No promotion before 20 receipts and 5 canaries in the area. Trust drops fast and rises slowly. | New areas start at L2. Outcome data per area is sparse and lags by weeks. |\n\n## Lanes\n| Lane | What the owner reads | Trigger |\n|---|---|---|\n| L0 Mechanical | Nothing, one summary line | A deterministic check passes (for example, regenerated files match) |\n| L1 Skim | Claims and story | Low blast radius, all claims at E2 or E3 |\n| L2 Focused | Flagged hunks and refusals | Unprotected hunks, refusals, E1-only claims |\n| L3 Full read | The whole diff | Security ceiling area, public API change, large blast radius, or a demoted area |\n\n**Reading budget (line-level):** flagged source and template hunks whole. Doc and test hunks only where they sit near an evidence gap. On #2283 the budget is 90 of 228 changed lines (39%). Counted by whole hunks it would be 226 of 228, so the line-level definition is what makes the number useful. Other changes: #2234 is 97 of 266, #2297 is 89 of 1392 (provisional, because X-Ray was not run there). #2129 goes to L3 and the budget is the whole diff, 1043 of 1043 lines. Its line-level figure would be 486 (46.6%), but we do not apply it under L3.\n\n## What the owner signs\n1. What was checked, and by what (executed test, mechanical check, cited argument).\n2. What was not checked, and why.\n3. The residual risk they accept, in their own words.\n\nWe do not accept \"the AI said it was fine\", an unowned merge, a confidence number without evidence, or a risk score nobody can explain.\n\n## What it found on four real agent changes\nEverything below is in `runs/`.\n\n- **#2283, Time Machine (E3).** The 3 new tests all fail on the old code with the issue's exact `IndexOutOfRangeException` (AD0001 and CS8785) and pass on the new code.\n- **#2283, the headline filter is a separate change.** Reverting the diagnostic filter (hunk h3) leaves both crash tests green. The crash fix is the `FirstOrDefault()` change (h5). The filter drops diagnostics for metadata types, which the issue does not ask for.\n- **#2283, one hunk is unprotected.** Reverting h4 breaks none of the 59 targeted tests, so it stays in the reading budget.\n- **#2283, a crash became silence.** A positional record with a null-key property used to crash the analyzer. Now it reports one diagnostic and silently omits the MsgPack005 that the equivalent class still gets. Our first reviewer's probe had no such case. Gemini, a second model family, proposed it and a test confirmed it.\n- **#2234, tests that prove nothing.** 4 of the agent's 8 new tests also pass on the old code. The branch is based before regression commit `1a74a620` (v3.1.1), so the fix may miss the cause the issue describes. The reviewer refuses to rule on that.\n- **#2297, scale.** 220 of 222 generated snapshots match the expected three-line pattern. 2 do not and go to a human. A newline change in `TransformUtilities` leaks into those 2, and the `NETSTANDARD2_0` guard leaves generated code uncovered on those targets.\n- **#2129, a large public-API change goes to a full read.** The new public attribute sits in the `src/MessagePack.Annotations` ceiling area and there is a public-API refusal, so the lane is L3. Time Machine: all 13 new tests fail on the base commit and pass on head. This is a weaker proof, because the attribute does not exist on base. X-Ray found 2 unprotected groups (the `IsUserDeclaredFormatter` equality line in `ObjectSerializationInfo`, and the four new analyzer descriptors). 11 claims: 5 at E3, 1 at E2, 5 at E1. 3 claims refused, 6 refusal cards. Read-only and private-setter members are silently skipped. Conflicting formatters give a plain CS0535 with no MessagePack diagnostic. Gemini found, and Claude missed, that a `[MessagePackFormatter]` custom formatter on a surrogate member is silently ignored (the wire shows 21, the formatter would give 42). Gemini once called a valid citation fabricated because it only saw the diff. The validator settled it.\n- **Citations.** 108 citations across the four changes, 0 invalid. Gemini once called a valid citation fabricated because it only saw the diff. The validator settled it.\n\n## How trust is measured\n| Metric | Definition |\n|---|---|\n| Escape rate | Post-merge defects on L0 and L1 changes divided by L0 and L1 changes |\n| Finding precision | Confirmed or owner-accepted findings divided by all findings |\n| Canary recall | Planted bugs caught divided by planted, per area |\n| Routed share | Changes sent to L2 or L3 divided by all changes |\n| Read ratio | Reading-budget lines divided by changed lines |\n| Time to merge | Median |\n| Guardrail | Review minutes per PR may fall only while revert rate and incidents stay flat |\n\nPromotion: 20 consecutive clean receipts and canary recall of at least 90% move an area one lane lighter. Any escape sends it to L3 until 10 clean receipts. Recall below 80% demotes one lane. Security ceiling areas never promote.\n\n**Measured so far**\n- Canary Drill, 11 canaries we planted. The union of reviewers caught 11 of 11, but 6 of the 11 rest on a single detector. Per reviewer: Claude 8, Gemini 5, deterministic rules 4, tests 3. Tests plus rules with no LLM caught 7 of 11 (64%), under our 80% demotion threshold. Hunk-level X-Ray alone routed 1 of 11 to a human. Read this as \"no canary slipped past every signal\", which is a weaker statement than 100% recall.\n- Prosecutor precision (Gemini, executed tests): 3 of 6 on #2283, 3 of 5 on #2297. On #2129, 6 attacks raised and 4 executed: 2 confirmed defects, 2 confirmed benign.\n- Blind claim extraction: Gemini produced 4, 5 and 6 claims where Claude produced 10, 8 and 8 (#2283, #2234, #2297). They overlap on 4, 4 and 5.\n- Cost per change, from `data/cost.json` (Gemini tokens, X-Ray or regeneration seconds): #2283 28,990 tokens and 295.6 s; #2234 25,957 and 125.4 s; #2297 31,286 and 7.8 s of regeneration; #2129 53,741 and 168.2 s. Not priced: no price list was checked, so the USD fields are empty. Claude session tokens were not measured.\n- Backtest on MessagePack-CSharp history: 84 merges over two years. 7 went to L1, 49 to L2, 28 to L3, so 92% reached a human lane. 0 escapes were found, so this only describes routing and says nothing about recall. A hand check of 10 labels agreed on 9 and missed one minor escape.\n\n## Line-by-line review as the default\nAs a default, no. For agent-written code it becomes a review of claims, plus targeted reading of lines where evidence cannot reach: refused claims, hunks no test notices, and security areas. The receipt records that the reading happened.\n\n## Limits\n- Producing evidence by running things has known holes: weak tests, flaky runs, equivalent mutants, and tests that fail for the wrong reason. Time Machine checks the failure signature, not only the exit code. UTBoost found 345 wrongly passed patches in SWE-Bench, so a green run is weak evidence.\n- Evidence is only as good as the tests. An area with no tests tops out at E1 and cannot leave L2.\n- X-Ray is not full coverage. Besides noticed and not noticed it can answer \"cannot tell\" (the hunk does not compile alone, or changes no behaviour). It cannot tell whether protected code is correct. We measured no precision or recall against commercial reviewers.\n- The canaries are ours. 11 of 11 by union hides that 6 rest on one detector and that the no-LLM part scores 64%. The Claude reviewer is the same model family that wrote our claims, so its hits are less independent than Gemini's.\n- The backtest found 0 escapes in 84 merges. We checked 10 of its labels by hand: it agreed on 9 and missed 1 minor escape (a same-day \"Fix version.json\"), so zero found does not mean zero happened.\n- A large public-API change goes to a full read. #2129 routes to L3 because the new public attribute sits in the `src/MessagePack.Annotations` ceiling area and there is a public-API refusal, so the budget is all 1,043 lines. The ceiling rule is path-based, so the owner also reads about 1000 lines unrelated to the attribute. A narrower rule is future work. The process does not replace design review.\n- The evidence base is small: one fix end to end (#2283), one contrast (#2234), one snapshot-heavy case (#2297), one large feature (#2129).\n- Not checked: the pinned SDK 8.0.402 cannot load the generator for execution tests (CS9057). The `SuppressedSourceGenerationTests` (#2234) and the execution-test projects for #2283 and #2234 were not run. The Roslyn analyzer and generator tests we cite were run and are unaffected.\n- The ledger history in the demo is SYNTHETIC. Only our runs and the backtest are real.\n\n## Technology notes\nCode decides evidence levels, lanes and the reading budget. The LLM proposes claims, hypotheses and wording. Citations are verified by string match against the diff. In a real pipeline the review runs on agent-authored PRs and a required status check stays pending until the code owner of the riskiest touched area signs. Lens packs per area cover frontend (accessibility, XSS, state), backend (correctness, compatibility, performance) and security (deserialisation, injection, secrets, suppression); only the backend and security packs ran in this demo. Compute on #2283, one laptop, run serially: base build 171 s, new tests about 80 s per side, Hunk X-Ray 296 s over 5 groups. LLM cost per review was not measured.\n\n## Built on\n- Google runs mutation testing inside code review, on changed code with heavy filtering (research.google, Practical Mutation Testing at Scale).\n- Meta's ACH uses an LLM to generate tests that kill mutants. Engineers accepted 73% of its tests in test-a-thons, and equivalent-mutant detection had recall 0.47 before pre-processing (arXiv 2501.12862).\n- UTBoost found 345 patches wrongly passed by the original SWE-Bench tests (arXiv 2506.09289).\n- Meta's Diff Risk Score estimates incident risk with a model. We route on evidence gaps and blast radius instead.\n- Anthropic's Code Review and Cursor's Bugbot verify findings with a second pass. Neither page says that it runs the PR's tests on the old code.\nWe have not benchmarked against any of these. Sources and what was verified: `research/SOURCES_VERIFIED.md`.\n\n## Monday adoption\n- First: agent PRs in one area that already has tests.\n- Who signs: the code owner of that area.\n- Measure for 8 weeks: reverts, review minutes, owners opening the receipt, later disagreement with findings.\n"};
